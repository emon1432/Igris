[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igris"
version = "0.1.0"
description = "Universal Autonomous Linux OS Operator and Co-Pilot"
authors = [{ name = "Emon", email = "developer@igris.ai" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "mss>=9.0.0",
    "pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "google-genai>=0.1.0",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.10",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
igris = "igris.cli:main"
